[package]
name = "liteedit"
version = "0.2.0"
description = "LiteEdit — editor kode super ringan (Tauri + Rust)"
license = "MIT"
authors = ["LiteEdit contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
base64 = "0.22"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
