# Release: setiap tag v* (mis. v0.2.0) -> build installer Windows & Linux,
# lalu publish sebagai GitHub Release otomatis.
#
# Cara rilis:
#   npm version minor        # atau patch / major, atau versi eksplisit: npm version 0.3.0
#   git push origin main --tags
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependensi sistem Tauri (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependensi npm
        run: npm ci

      - name: Pastikan versi package.json == tag
        shell: node {0}
        run: |
          const v = require('./package.json').version;
          const t = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          if (v !== t) {
            console.error(`package.json (${v}) tidak sama dengan tag (${t})`);
            process.exit(1);
          }
          console.log('versi == tag:', v);

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LiteEdit ${{ github.ref_name }}"
          releaseBody: "Lihat CHANGELOG.md untuk daftar perubahan."
          releaseDraft: false
          prerelease: false
